<!-- Feature Carousel Section -->
<section id="experience" class="p-0">
  <div id="mainCarousel" class="carousel slide carousel-fade" data-bs-ride="carousel">
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
      <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
      <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
    </div>
    <div class="carousel-inner">
      <div class="carousel-item active" data-bs-interval="4000">
        <img src="https://images.unsplash.com/photo-1414235077428-338989a2e8c0?auto=format&fit=crop&q=80&w=1920" class="d-block w-100 carousel-img" alt="Ambiance">
        <div class="carousel-caption d-none d-md-block carousel-overlay" data-aos="fade-up" data-aos-duration="1000">
          <h2 class="display-4 font-weight-bold text-white text-shadow" style="font-family: 'Playfair Display', serif;">Elegant Atmosphere</h2>
          <p class="fs-4 text-light text-shadow fw-light">Experience dining in an award-winning interior designed for comfort and luxury.</p>
        </div>
      </div>
      <div class="carousel-item" data-bs-interval="4000">
        <img src="https://images.unsplash.com/photo-1544025162-8315ea07525b?auto=format&fit=crop&q=80&w=1920" class="d-block w-100 carousel-img" alt="Signature Dish">
        <div class="carousel-caption d-none d-md-block carousel-overlay">
          <h2 class="display-4 font-weight-bold text-white text-shadow" style="font-family: 'Playfair Display', serif;">Signature Creations</h2>
          <p class="fs-4 text-light text-shadow fw-light">Taste the masterpiece dishes crafted by our executive chefs.</p>
        </div>
      </div>
      <div class="carousel-item" data-bs-interval="4000">
        <img src="https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?auto=format&fit=crop&q=80&w=1920" class="d-block w-100 carousel-img" alt="Exquisite Drinks">
        <div class="carousel-caption d-none d-md-block carousel-overlay">
          <h2 class="display-4 font-weight-bold text-white text-shadow" style="font-family: 'Playfair Display', serif;">World-class Mixology</h2>
          <p class="fs-4 text-light text-shadow fw-light">Pair your meal with our sommelier-selected wines and crafted cocktails.</p>
        </div>
      </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#mainCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#mainCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>
</section>
