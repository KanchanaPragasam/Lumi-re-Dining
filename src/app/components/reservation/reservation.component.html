    <!-- Reservation Section -->
    <section class="page-section bg-dark-alt" id="reservation">
        <div class="container">
            <div class="text-center">
                <h2 class="section-heading text-uppercase text-white">Book a Table</h2>
                <h3 class="section-subheading text-gold">Reserve Your Experience</h3>
            </div>
            <div class="row justify-content-center">
                <div class="col-lg-10 col-xl-8">
                    <div class="glass-card p-4 p-md-5 rounded-4" data-aos="fade-up" data-aos-duration="1000">
                        <form id="reservationForm" novalidate (submit)="onSubmit($event)">
                            <div *ngIf="!submitted">
                                <div class="row align-items-stretch mb-4">
                                    <div class="col-md-6">
                                        <div class="form-floating mb-4">
                                            <input class="form-control text-white" id="name" type="text" placeholder="Your Name" required="required" />
                                            <label for="name" class="text-muted">Your Name *</label>
                                        </div>
                                        <div class="form-floating mb-4">
                                            <input class="form-control text-white" id="email" type="email" placeholder="Your Email" required="required" />
                                            <label for="email" class="text-muted">Your Email *</label>
                                        </div>
                                        <div class="form-floating mb-4 mb-md-0">
                                            <input class="form-control text-white" id="phone" type="tel" placeholder="Your Phone" required="required" />
                                            <label for="phone" class="text-muted">Your Phone *</label>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-floating mb-4">
                                            <input class="form-control text-white" id="date" type="date" placeholder="Date" required="required" [min]="minDate" style="color-scheme: dark;" />
                                            <label for="date" class="text-muted">Date *</label>
                                        </div>
                                        <div class="form-floating mb-4">
                                            <input class="form-control text-white" id="time" type="time" placeholder="Time" required="required" style="color-scheme: dark;" />
                                            <label for="time" class="text-muted">Time *</label>
                                        </div>
                                        <div class="form-floating mb-0">
                                            <select class="form-select text-white" id="guests" aria-label="Number of Guests" required>
                                                <option value="" selected disabled class="text-dark">Select Guests *</option>
                                                <option value="1" class="text-dark">1 Person</option>
                                                <option value="2" class="text-dark">2 People</option>
                                                <option value="3" class="text-dark">3 People</option>
                                                <option value="4" class="text-dark">4 People</option>
                                                <option value="5" class="text-dark">5+ People</option>
                                            </select>
                                            <label for="guests" class="text-muted">Guests</label>
                                        </div>
                                    </div>
                                </div>
                                <div *ngIf="errorMessage" class="alert alert-danger bg-transparent border-danger text-danger mb-4 text-start">
                                    <i class="fas fa-exclamation-circle me-2"></i> {{ errorMessage }}
                                </div>
                                <div class="text-center mt-5">
                                    <button class="btn btn-gold btn-xl text-uppercase shadow-lg w-100 rounded-pill" id="sendMessageButton" type="submit" [disabled]="isSubmitting">
                                        <span *ngIf="!isSubmitting">Complete Reservation</span>
                                        <span *ngIf="isSubmitting"><i class="fas fa-spinner fa-spin me-2"></i> Confirming...</span>
                                    </button>
                                </div>
                            </div>
                            
                            <!-- Success Message View -->
                            <div *ngIf="submitted" class="text-center py-5 fade-in-up">
                                <i class="fas fa-check-circle text-gold mb-4" style="font-size: 5rem; text-shadow: 0 0 20px rgba(226,194,98,0.5);"></i>
                                <h3 class="text-white mb-3" style="font-family: 'Playfair Display', serif;">Reservation Confirmed!</h3>
                                <p class="text-muted fs-5 mb-5 mx-auto" style="max-width: 400px;">Thank you for choosing us. We have received your request and look forward to hosting you. A confirmation email will be sent shortly.</p>
                                <button type="button" class="btn btn-outline-light btn-xl rounded-pill" (click)="submitted = false">Make Another Reservation</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
